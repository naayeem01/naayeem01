<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="DiagoNet: diagnostic centre software with LIS. Interfaces with lab analyzers, imports results automatically, prints reports, works online and offline.">
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="14"/></clipPath>

  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { font-family: Georgia, 'Times New Roman', Times, serif; }
    .fi { animation: fi .9s ease-out both; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
    .on { animation: on 10s infinite; }
    .off { opacity: 0; animation: off 10s infinite; }
    .dim { animation: dim 10s infinite; }
    @keyframes on { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes off { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dim { 0%, 45% { opacity: 1; } 50%, 95% { opacity: .25; } 100% { opacity: 1; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(6px); } }
    .draw { stroke-dasharray: 1400; animation: draw 1.6s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 1400; } }
    @media (prefers-color-scheme: dark) { .bg { fill: #F8FAFC; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .spin { transform-origin: 800px 183px; animation: spin 30s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { animation: row 8s ease-out infinite both; }
    @keyframes row { 0% { opacity: 0; transform: translateX(-10px); } 6%, 82% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
    .up { animation: up 1.4s ease-in-out infinite; }
    @keyframes up { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-3px); opacity: 0; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="1199" height="339" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="52" cy="48" r="4" fill="#0D9488"/>
  <text class="m" x="64" y="52" font-size="12" font-weight="700" fill="#475569" letter-spacing="2.5">DIAGNOSTIC CENTRE · LIS</text>
  <rect x="301" y="37" width="78" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="m" x="340.1" y="51" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle" letter-spacing="1.5">FLAGSHIP</text>
  <g class="fi"><text class="s" x="46" y="100" font-size="40" font-weight="400" fill="#0F172A">DiagoNet</text></g>
  <g class="fi" style="animation-delay:0.15s"><text class="f" x="48" y="132" font-size="15" font-weight="400" fill="#475569">Lab information system for diagnostic centres.</text></g>
  <g class="fi" style="animation-delay:0.23s"><text class="f" x="48" y="154" font-size="15" font-weight="400" fill="#475569">Results flow from the analyzer straight into the report:</text></g>
  <g class="fi" style="animation-delay:0.31s"><text class="f" x="48" y="176" font-size="15" font-weight="400" fill="#475569">no retyping and no transcription errors.</text></g>
  <g class="fi" style="animation-delay:0.40s"><rect x="48" y="204" width="174" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="63" cy="218" r="3" fill="#0D9488"/><text class="f" x="73" y="223" font-size="13" font-weight="500" fill="#334155">Analyzer interfacing</text></g>
  <g class="fi" style="animation-delay:0.50s"><rect x="232" y="204" width="160" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="247" cy="218" r="3" fill="#0D9488"/><text class="f" x="257" y="223" font-size="13" font-weight="500" fill="#334155">Auto result import</text></g>
  <g class="fi" style="animation-delay:0.60s"><rect x="48" y="240" width="215" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="63" cy="254" r="3" fill="#0D9488"/><text class="f" x="73" y="259" font-size="13" font-weight="500" fill="#334155">Report printing &amp; delivery</text></g>
  <g class="fi" style="animation-delay:0.70s"><rect x="273" y="240" width="188" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="288" cy="254" r="3" fill="#0D9488"/><text class="f" x="298" y="259" font-size="13" font-weight="500" fill="#334155">Works online &amp; offline</text></g>
  <g class="nudge"><text class="f" x="48" y="306" font-size="13" font-weight="700" fill="#1E40AF" letter-spacing="1">Request a demo  →</text></g>
