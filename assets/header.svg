<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Niem Mandol, Founder and CTO of TNXBD IT Solution. Products: DiagoNet, OushodCloud, MediSlot, KormoLink.">
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="14"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#CBD5E1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="#fff"/></linearGradient>
    <mask id="dm"><rect x="700" y="0" width="500" height="360" fill="url(#fade)"/></mask>
    <clipPath id="tw0"><rect x="64" y="236" width="0" height="30"><animate attributeName="width" values="0;367.2;367.2;0;0" keyTimes="0.0000;0.1000;0.2800;0.3100;1.0000" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tw1"><rect x="64" y="236" width="0" height="30"><animate attributeName="width" values="0;0;334.8;334.8;0;0" keyTimes="0.0000;0.3333;0.4333;0.6133;0.6433;1.0000" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tw2"><rect x="64" y="236" width="0" height="30"><animate attributeName="width" values="0;0;345.6;345.6;0;0" keyTimes="0.0000;0.6667;0.7667;0.9467;0.9767;1.0000" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { font-family: Georgia, 'Times New Roman', Times, serif; }
    .fi { animation: fi .9s ease-out both; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
    .on { animation: on 10s infinite; }
    .off { opacity: 0; animation: off 10s infinite; }
    .dim { animation: dim 10s infinite; }
    @keyframes on { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes off { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dim { 0%, 45% { opacity: 1; } 50%, 95% { opacity: .25; } 100% { opacity: 1; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(6px); } }
    .draw { stroke-dasharray: 1400; animation: draw 1.6s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 1400; } }
    @media (prefers-color-scheme: dark) { .bg { fill: #F8FAFC; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .spin { transform-origin: 960px 185px; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <rect class="bg" x=".5" y=".5" width="1199" height="359" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="4" fill="#1E40AF"/>
    <rect x="700" y="4" width="500" height="356" fill="url(#dots)" mask="url(#dm)"/>
  </g>
  <g class="fi"><text class="m" x="64" y="84" font-size="13" font-weight="700" fill="#1E40AF" letter-spacing="3">TNXBD IT SOLUTION  ·  MIRPUR, DHAKA</text></g>
  <g class="fi" style="animation-delay:.15s"><text class="s" x="62" y="152" font-size="62" font-weight="400" fill="#0F172A">Niem Mandol</text></g>
  <g class="fi" style="animation-delay:.3s"><text class="f" x="64" y="194" font-size="20" font-weight="400" fill="#475569">Founder &amp; CTO. Building healthcare and enterprise software.</text></g>
  <line x1="64" y1="218" x2="124" y2="218" stroke="#1E40AF" stroke-width="2" class="draw"/>
  <g clip-path="url(#tw0)"><text class="m" x="64" y="258" font-size="18" font-weight="600" fill="#1E40AF" textLength="367.2" lengthAdjust="spacingAndGlyphs">Lab &amp; diagnostic software with LIS</text></g>
  <g clip-path="url(#tw1)"><text class="m" x="64" y="258" font-size="18" font-weight="600" fill="#1E40AF" textLength="334.8" lengthAdjust="spacingAndGlyphs">Pharmacy, clinic &amp; HR platforms</text></g>
  <g clip-path="url(#tw2)"><text class="m" x="64" y="258" font-size="18" font-weight="600" fill="#1E40AF" textLength="345.6" lengthAdjust="spacingAndGlyphs">Built to work online and offline</text></g>
  <rect x="64" y="240" width="9" height="22" fill="#3B82F6" class="blink"><animate attributeName="x" values="68.0;435.2;435.2;68.0;68.0;402.8;402.8;68.0;68.0;413.6;413.6;68.0;68.0" keyTimes="0.0000;0.1000;0.2800;0.3100;0.3333;0.4333;0.6133;0.6433;0.6667;0.7667;0.9467;0.9767;1.0000" dur="12s" repeatCount="indefinite"/></rect>
  <g class="fi" style="animation-delay:0.60s"><rect x="64" y="290" width="177" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/><circle cx="81" cy="306" r="3.5" fill="#3B82F6"/><text class="m" x="92" y="310" font-size="12" font-weight="700" fill="#1E40AF" letter-spacing="1.2">5+ YEARS SHIPPING</text></g>
  <g class="fi" style="animation-delay:0.75s"><rect x="253" y="290" width="118" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/><circle cx="270" cy="306" r="3.5" fill="#3B82F6"/><text class="m" x="281" y="310" font-size="12" font-weight="700" fill="#1E40AF" letter-spacing="1.2">4 PRODUCTS</text></g>
  <g class="fi" style="animation-delay:0.90s"><rect x="383" y="290" width="168" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/><circle cx="400" cy="306" r="3.5" fill="#3B82F6"/><text class="m" x="411" y="310" font-size="12" font-weight="700" fill="#1E40AF" letter-spacing="1.2">ONLINE + OFFLINE</text></g>
  <circle cx="960" cy="185" r="66" fill="#EFF6FF"/>
  <circle cx="960" cy="185" r="66" fill="none" stroke="#93C5FD" stroke-dasharray="3 7" class="spin"/>
  <line x1="830" y1="95" x2="960" y2="185" stroke="#E2E8F0" stroke-width="1.5" class="draw" style="animation-delay:0.40s"/>
  <line x1="1090" y1="95" x2="960" y2="185" stroke="#E2E8F0" stroke-width="1.5" class="draw" style="animation-delay:0.55s"/>
  <line x1="830" y1="275" x2="960" y2="185" stroke="#E2E8F0" stroke-width="1.5" class="draw" style="animation-delay:0.70s"/>
  <line x1="1090" y1="275" x2="960" y2="185" stroke="#E2E8F0" stroke-width="1.5" class="draw" style="animation-delay:0.85s"/>
  <circle cx="830" cy="95" r="4" fill="#0D9488"><animateMotion path="M0 0L130 90" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="95" r="4" fill="#0D9488"><animateMotion path="M0 0L130 90" dur="2.6s" begin="1.30s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="95" r="4" fill="#16A34A"><animateMotion path="M0 0L-130 90" dur="2.6s" begin="0.65s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="95" r="4" fill="#16A34A"><animateMotion path="M0 0L-130 90" dur="2.6s" begin="1.95s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="275" r="4" fill="#0284C7"><animateMotion path="M0 0L130 -90" dur="2.6s" begin="1.30s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="275" r="4" fill="#0284C7"><animateMotion path="M0 0L130 -90" dur="2.6s" begin="2.60s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="275" r="4" fill="#4F46E5"><animateMotion path="M0 0L-130 -90" dur="2.6s" begin="1.95s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="275" r="4" fill="#4F46E5"><animateMotion path="M0 0L-130 -90" dur="2.6s" begin="3.25s" repeatCount="indefinite"/></circle>
  <g class="fi" style="animation-delay:0.50s"><circle cx="830" cy="95" r="28" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/><text class="s" x="830" y="102" font-size="22" font-weight="400" fill="#0D9488" text-anchor="middle">D</text><text class="f" x="830" y="53" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">DiagoNet</text></g>
  <g class="fi" style="animation-delay:0.65s"><circle cx="1090" cy="95" r="28" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/><text class="s" x="1090" y="102" font-size="22" font-weight="400" fill="#16A34A" text-anchor="middle">O</text><text class="f" x="1090" y="53" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">OushodCloud</text></g>
  <g class="fi" style="animation-delay:0.80s"><circle cx="830" cy="275" r="28" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/><text class="s" x="830" y="282" font-size="22" font-weight="400" fill="#0284C7" text-anchor="middle">M</text><text class="f" x="830" y="327" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">MediSlot</text></g>
  <g class="fi" style="animation-delay:0.95s"><circle cx="1090" cy="275" r="28" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="s" x="1090" y="282" font-size="22" font-weight="400" fill="#4F46E5" text-anchor="middle">K</text><text class="f" x="1090" y="327" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">KormoLink</text></g>
  <rect x="916" y="141" width="88" height="88" rx="20" fill="#1E40AF"/>
<text class="f" x="960" y="190" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TNXBD</text>
<text class="m" x="960" y="209" font-size="8" font-weight="600" fill="#BFDBFE" text-anchor="middle" letter-spacing="1.5">IT SOLUTION</text>
</svg>
