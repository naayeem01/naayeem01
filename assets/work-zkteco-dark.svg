<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="ZKTeco ADMS Manager: Desktop app for biometric devices: attendance, employees, live events.">
  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" x2="260">
      <stop offset="0" stop-color="#f0883e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-280 0;-280 0;1220 0;1220 0" keyTimes="0;.1;.55;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .num { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f0883e; }
    .name { font: 400 34px Georgia, 'Times New Roman', Times, serif; fill: #e6edf3; }
    .desc { font: 400 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .stack { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .arrow { font: 400 30px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0883e; }
  </style>
  <rect width="1200" height="112" fill="#0d1117"/>
  <rect x="0" y="22" width="3" height="68" fill="#f0883e">
    <animate attributeName="opacity" values="1;.25;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <text class="num" x="24" y="50">03</text>
  <text class="name" x="84" y="54">ZKTeco ADMS Manager</text>
  <text class="desc" x="84" y="86">Desktop app for biometric devices: attendance, employees, live events.</text>
  <text class="stack" x="1110" y="50" text-anchor="end">Python · ADMS push protocol</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 -5;0 0;0 0" keyTimes="0;.5;.6;.7;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    <text class="arrow" x="1170" y="54" text-anchor="end">↗</text>
  </g>
  <line x1="0" y1="111.5" x2="1200" y2="111.5" stroke="#30363d"/>
  <line x1="0" y1="111" x2="1200" y2="111" stroke="url(#sweep)" stroke-width="2"/>
</svg>
