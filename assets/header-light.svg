<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Niem Mandol, Founder and CTO of TNXBD IT Solution">
  <style>
    .name { font: 400 84px Georgia, 'Times New Roman', Times, serif; fill: #1f2328; letter-spacing: -1px; }
    .role { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6e7781; letter-spacing: 3.2px; }
    .lede { font: italic 400 22px Georgia, 'Times New Roman', Times, serif; fill: #1f2328; opacity: .85; }
    .label { font: 600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c2410c; letter-spacing: 2.5px; }
    .now { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
    .n1, .n2 { opacity: 0; }
    .n0 { animation: c0 9s infinite; }
    .n1 { animation: c1 9s infinite; }
    .n2 { animation: c2 9s infinite; }
    @keyframes c0 { 0%,31% { opacity: 1; } 32.5%,98.5% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes c1 { 0%,33.5% { opacity: 0; } 35%,64.5% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes c2 { 0%,67% { opacity: 0; } 68.5%,97% { opacity: 1; } 98.5%,100% { opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="300" fill="#f6f4ef"/>
  <text class="role" x="48" y="64">FOUNDER &amp; CTO · TNXBD IT SOLUTION · DHAKA</text>
  <text class="name" x="44" y="152">Niem Mandol</text>
  <line x1="48" y1="176" x2="408" y2="176" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  <text class="lede" x="48" y="226">I build software that businesses can rely on.</text>

  <line x1="800" y1="70" x2="800" y2="236" stroke="#d8d4ca"/>
  <text class="label" x="840" y="100">CURRENTLY</text>
  <text class="now" x="840" y="140" fill="#6e7781" style="fill:#6e7781">~/tnxbd $ status</text>
  <text class="now n0" x="840" y="196">shipping ShortLink v2</text><text class="now n1" x="840" y="196">building ERP &amp; HRMS for clients</text><text class="now n2" x="840" y="196">learning LLM agents &amp; MLOps</text>
  <rect class="caret" x="840" y="212" width="9" height="16" fill="#c2410c"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#d8d4ca"/>
</svg>
