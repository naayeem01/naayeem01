<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="TNXBD Website: The home base of TNXBD IT Solution.">
  <defs>
    <clipPath id="card"><rect width="1200" height="96" rx="14"/></clipPath>

  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { font-family: Georgia, 'Times New Roman', Times, serif; }
    .fi { animation: fi .9s ease-out both; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
    .on { animation: on 10s infinite; }
    .off { opacity: 0; animation: off 10s infinite; }
    .dim { animation: dim 10s infinite; }
    @keyframes on { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes off { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dim { 0%, 45% { opacity: 1; } 50%, 95% { opacity: .25; } 100% { opacity: 1; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(6px); } }
    .draw { stroke-dasharray: 1400; animation: draw 1.6s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 1400; } }
    @media (prefers-color-scheme: dark) { .bg { fill: #F8FAFC; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  </style>
  <rect class="bg" x=".5" y=".5" width="1199" height="95" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text class="m" x="36" y="56" font-size="20" font-weight="700" fill="#1E40AF">05</text>
  <line x1="84" y1="24" x2="84" y2="72" stroke="#E2E8F0"/>
  <text class="f" x="108" y="44" font-size="19" font-weight="600" fill="#0F172A">TNXBD Website</text>
  <text class="f" x="108" y="70" font-size="14.5" font-weight="400" fill="#64748B">The home base of TNXBD IT Solution.</text>
  <text class="m" x="1060" y="44" font-size="11" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1.5">REACT · VITE · TYPESCRIPT</text>
  <g class="nudge"><text class="f" x="1166" y="54" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="end" letter-spacing="0.5">View  →</text></g>
</svg>
