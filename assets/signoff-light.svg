<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Thanks for stopping by. Niem">
  <style>
    .big { font: italic 400 46px Georgia, 'Times New Roman', Times, serif; fill: #1f2328; stroke: #1f2328; stroke-width: 1;
            stroke-dasharray: 420; animation: write 12s ease-in-out infinite; }
    .sig { font: italic 400 30px Georgia, 'Times New Roman', Times, serif; fill: #c2410c; stroke: #c2410c; stroke-width: .8;
            stroke-dasharray: 420; animation: write 12s ease-in-out .4s infinite; }
    .meta { font: 600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6e7781; letter-spacing: 2.5px; }
    @keyframes write {
      0%, 62%   { stroke-dashoffset: 0;   fill-opacity: 1; }
      68%       { stroke-dashoffset: 0;   fill-opacity: 0; }
      74%, 76%  { stroke-dashoffset: 420; fill-opacity: 0; }
      94%       { stroke-dashoffset: 0;   fill-opacity: 0; }
      100%      { stroke-dashoffset: 0;   fill-opacity: 1; }
    }
  </style>
  <text class="big" x="600" y="78" text-anchor="middle">Thanks for stopping by.</text>
  <text class="sig" x="600" y="124" text-anchor="middle">— Niem</text>
  <text class="meta" x="600" y="160" text-anchor="middle">MIRPUR · DHAKA · BANGLADESH</text>
</svg>
