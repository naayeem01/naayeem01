<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="OushodCloud: pharmacy management software with POS, stock and expiry alerts, supplier purchases and multi-branch sync, online and offline.">
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="14"/></clipPath>

  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { font-family: Georgia, 'Times New Roman', Times, serif; }
    .fi { animation: fi .9s ease-out both; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
    .on { animation: on 10s infinite; }
    .off { opacity: 0; animation: off 10s infinite; }
    .dim { animation: dim 10s infinite; }
    @keyframes on { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes off { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dim { 0%, 45% { opacity: 1; } 50%, 95% { opacity: .25; } 100% { opacity: 1; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(6px); } }
    .draw { stroke-dasharray: 1400; animation: draw 1.6s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 1400; } }
    @media (prefers-color-scheme: dark) { .bg { fill: #F8FAFC; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .pr { animation: pr 8s ease-out infinite both; }
    @keyframes pr { 0% { opacity: 0; transform: translateY(-6px); } 5%, 85% { opacity: 1; transform: none; } 95%, 100% { opacity: 0; } }
    .low { opacity: 0; animation: low 8s infinite; }
    @keyframes low { 0%, 38% { opacity: 0; } 42%, 62% { opacity: 1; } 66%, 100% { opacity: 0; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="1199" height="299" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="52" cy="48" r="4" fill="#16A34A"/>
  <text class="m" x="64" y="52" font-size="12" font-weight="700" fill="#475569" letter-spacing="2.5">PHARMACY MANAGEMENT</text>
  <g class="fi"><text class="s" x="46" y="100" font-size="40" font-weight="400" fill="#0F172A">OushodCloud</text></g>
  <g class="fi" style="animation-delay:0.15s"><text class="f" x="48" y="132" font-size="15" font-weight="400" fill="#475569">Point of sale, stock and expiry tracking for pharmacies,</text></g>
  <g class="fi" style="animation-delay:0.23s"><text class="f" x="48" y="154" font-size="15" font-weight="400" fill="#475569">from a single shop to a chain of branches.</text></g>
  <g class="fi" style="animation-delay:0.40s"><rect x="48" y="182" width="126" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="63" cy="196" r="3" fill="#16A34A"/><text class="f" x="73" y="201" font-size="13" font-weight="500" fill="#334155">POS &amp; billing</text></g>
  <g class="fi" style="animation-delay:0.50s"><rect x="184" y="182" width="181" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="199" cy="196" r="3" fill="#16A34A"/><text class="f" x="209" y="201" font-size="13" font-weight="500" fill="#334155">Stock &amp; expiry alerts</text></g>
