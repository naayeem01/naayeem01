  <g class="pr" style="animation-delay:3s"><line x1="598" y1="206" x2="766" y2="206" stroke="#CBD5E1" stroke-dasharray="3 3"/><text class="m" x="598" y="226" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="1">TOTAL</text><text class="m" x="766" y="226" font-size="11" font-weight="700" fill="#16A34A" text-anchor="end">Tk 154.00</text><text class="m" x="682" y="244" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">PAID · THANK YOU</text></g>
