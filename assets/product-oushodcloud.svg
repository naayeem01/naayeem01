  <g class="pr" style="animation-delay:1.0s"><text class="m" x="598" y="144" font-size="10.5" font-weight="500" fill="#0F172A">Omeprazole x10</text><text class="m" x="766" y="144" font-size="10.5" font-weight="600" fill="#0F172A" text-anchor="end">70.00</text></g>
  <g class="pr" style="animation-delay:1.6s"><text class="m" x="598" y="166" font-size="10.5" font-weight="500" fill="#0F172A">Cetirizine x10</text><text class="m" x="766" y="166" font-size="10.5" font-weight="600" fill="#0F172A" text-anchor="end">30.00</text></g>
