<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="KormoLink: HR, payroll and attendance software supporting fingerprint and face recognition devices, payslips and employee ID card printing.">
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="14"/></clipPath>

  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { font-family: Georgia, 'Times New Roman', Times, serif; }
    .fi { animation: fi .9s ease-out both; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
    .on { animation: on 10s infinite; }
    .off { opacity: 0; animation: off 10s infinite; }
    .dim { animation: dim 10s infinite; }
    @keyframes on { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes off { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dim { 0%, 45% { opacity: 1; } 50%, 95% { opacity: .25; } 100% { opacity: 1; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(6px); } }
    .draw { stroke-dasharray: 1400; animation: draw 1.6s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 1400; } }
    @media (prefers-color-scheme: dark) { .bg { fill: #F8FAFC; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .scan { animation: scan 2.4s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(56px); } }
    .lock { transform-origin: 794px 112px; animation: lock 5s ease-out infinite; }
    @keyframes lock { 0% { transform: scale(1.35); opacity: .2; } 30%, 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: .2; } }
    .match { animation: match 5s ease-out infinite; }
    @keyframes match { 0%, 30% { opacity: 0; } 38%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .lg { animation: lg 10s ease-out infinite both; }
    @keyframes lg { 0% { opacity: 0; transform: translateX(-6px); } 4%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
    .idc { animation: idc 10s ease-out infinite; }
    @keyframes idc { 0%, 20% { opacity: 0; transform: translateY(18px); } 30%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: translateY(0); } }
  </style>
