<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-label="Trimly: Self-hosted links, QR codes and a token-authenticated JSON API.">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5ce1ff" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5ce1ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="0" x2="300">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0"/><stop offset=".5" stop-color="#5ce1ff"/><stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0;-320 0;1220 0;1220 0" keyTimes="0;.1;.6;1" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c"><path d="M20.5 0.5H1199.5V103.5L1179.5 123.5H0.5V20.5Z"/></clipPath>
  </defs>
  <style>
    .num { font: 800 54px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: none; stroke: #5ce1ff; stroke-width: 1.2; }
    .name { font: 800 30px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8f6ff; letter-spacing: 1.5px; }
    .desc { font: 400 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #7f9bb0; }
    .stack { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #5ce1ff; letter-spacing: 2px; }
    .st { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3ddc84; letter-spacing: 2px; }
    .go { font: 800 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f2b632; letter-spacing: 3px; }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="124" fill="#07121e"/>
    <rect width="1200" height="124" fill="url(#grid)"/>
    <rect width="1200" height="124" fill="url(#sw)" opacity=".07"/>
  </g>
  <path d="M20.5 0.5H1199.5V103.5L1179.5 123.5H0.5V20.5Z" fill="none" stroke="#5ce1ff" stroke-opacity=".35"/>
  <path d="M20.5 0.5H1199.5V103.5L1179.5 123.5H0.5V20.5Z" fill="none" stroke="url(#sw)" stroke-width="2"/>
  <text class="num" x="28" y="82">02</text>
  <line x1="122" y1="26" x2="122" y2="98" stroke="#5ce1ff" stroke-opacity=".3"/>
  <text class="name" x="146" y="54">Trimly</text>
  <text class="desc" x="146" y="82">Self-hosted links, QR codes and a token-authenticated JSON API.</text>
  <text class="stack" x="146" y="106">LARAVEL 12 · ALPINE.JS · CHART.JS</text>
  <polyline points="900,66 910,62 920,67 930,71 940,61 950,62 960,76 970,63 980,59 990,74 1000,67 1010,58 1020,68 1030,73 1040,60 1050,65 1060,71 1070,64 1080,64" fill="none" stroke="#5ce1ff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="6 3">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.5s" repeatCount="indefinite"/>
  </polyline>
  <circle cx="1104" cy="40" r="4" fill="#3ddc84"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/></circle>
  <text class="st" x="1116" y="45">STABLE</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 0;0 0;0 0" keyTimes="0;.5;.6;.7;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    <text class="go" x="1170" y="92" text-anchor="end">ACCESS ▸</text>
  </g>
</svg>
